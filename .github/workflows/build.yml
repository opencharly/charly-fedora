name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package (e.g. 2026.227.1026)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          for f in bin/charly-linux-*; do
            mv "$f" "bin/charly-${f#bin/charly-linux-}"
          done
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-plugins-linux-*.tar.gz' --dir .
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          for arch in amd64 arm64; do
            mkdir -p plugins/$arch
            tar -xzf charly-plugins-linux-$arch.tar.gz -C plugins/$arch
          done

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          sudo mkdir -p /usr/lib/charly/plugins
          sudo install -Dm644 plugins/amd64/*.providers /usr/lib/charly/plugins/
          sudo install -Dm755 plugins/amd64/plugin-* /usr/lib/charly/plugins/
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          sudo install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          sudo install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > key.gpg
          chmod 600 key.gpg

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ inputs.version }} \
                --arch $arch \
                --variant $variant \
                --formats rpm \
                --out repo/$arch \
                --signing-key key.gpg
            done
          done

      - name: Assemble + sign the repodata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws:rw" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            fedora:43 bash -c '
            set -e
            dnf install -y createrepo_c gnupg2 >/dev/null
            export GNUPGHOME=/tmp/gnupg
            mkdir -p $GNUPGHOME && chmod 700 $GNUPGHOME
            gpg --batch --import /ws/key.gpg
            for arch in amd64 arm64; do
              cd /ws/repo/$arch
              createrepo_c .
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file <(echo "$GPG_PASSPHRASE") \
                --detach-sign --armor repodata/repomd.xml
            done
          '

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            newest=$(ls repo/$arch/charly-*.rpm | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" repo/$arch/charly-$arch.rpm
          done

      - name: Install-test
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/ws:ro" fedora:43 bash -c '
            set -e
            printf "[charly]\nname=charly\nbaseurl=file:///ws/repo/amd64\nenabled=1\ngpgcheck=1\ngpgkey=file:///ws/RPM-GPG-KEY-charly\n" > /etc/yum.repos.d/charly.repo
            dnf install -y charly
            # charly v2026.250.0854+ ships systemd units + /etc/charly config
            test -f /usr/lib/systemd/system/charly-mcp.service && test -f /usr/lib/systemd/user/charly-mcp.service || { echo "packaged charly-mcp units missing"; exit 1; }
            # non-autostarting: no post-install enable — is-enabled must be
            # 'disabled', or the no-systemd-manager error in the container
            if command -v systemctl >/dev/null 2>&1; then
              state=$(systemctl is-enabled charly-mcp 2>/dev/null || true)
              case "$state" in
                ""|disabled) ;;
                *) echo "charly-mcp unexpectedly enabled: $state"; exit 1 ;;
              esac
            else
              grep -q '^WantedBy=' /usr/lib/systemd/system/charly-mcp.service || { echo "system unit lacks WantedBy="; exit 1; }
            fi
            # ...and no enable marker (wants symlink) exists
            test ! -e /etc/systemd/system/multi-user.target.wants/charly-mcp.service || { echo "unexpected enable marker present"; exit 1; }
            # the shipped system-wide config validates
            test -f /etc/charly/charly.yml || { echo "/etc/charly/charly.yml missing"; exit 1; }
            charly box validate -C /etc/charly >/dev/null || { echo "box validate failed"; exit 1; }
            # the MCP server starts on demand (no systemd in the container: run
            # it in the foreground and require it to stay up until the timeout)
            (cd /etc/charly && timeout 5 charly mcp serve --listen 127.0.0.1:18765 >/dev/null 2>&1) || serve=$?
            test "$serve" -eq 124 || { echo "charly mcp serve exited $serve (expected 124 = ran until timeout)"; exit 1; }
            cd /tmp && charly doctor
          '

      - name: Stage static files
        run: |
          # The upload path is repo/, so the committed landing page, .nojekyll,
          # and public key must be copied in or the site root 404s.
          cp index.html .nojekyll RPM-GPG-KEY-charly repo/

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy
        uses: actions/deploy-pages@v4
