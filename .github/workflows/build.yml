name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package (e.g. 2026.227.1026)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-plugins-linux-*.tar.gz' --dir .
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          for arch in amd64 arm64; do
            mkdir -p plugins/$arch
            tar -xzf charly-plugins-linux-$arch.tar.gz -C plugins/$arch
          done

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          install -Dm644 plugins/amd64/*.providers /usr/lib/charly/plugins/
          install -Dm755 plugins/amd64/plugin-* /usr/lib/charly/plugins/
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > key.gpg
          chmod 600 key.gpg

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ inputs.version }} \
                --arch $arch \
                --variant $variant \
                --formats rpm \
                --out repo/$arch \
                --signing-key key.gpg
            done
          done

      - name: Assemble + sign the repodata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws:rw" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            fedora:43 bash -c '
            set -e
            dnf install -y createrepo_c gnupg2 >/dev/null
            export GNUPGHOME=/tmp/gnupg
            mkdir -p $GNUPGHOME && chmod 700 $GNUPGHOME
            gpg --batch --import /ws/key.gpg
            for arch in amd64 arm64; do
              cd /ws/repo/$arch
              createrepo_c .
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file <(echo "$GPG_PASSPHRASE") \
                --detach-sign --armor repodata/repomd.xml
            done
          '

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            newest=$(ls repo/$arch/charly-*.rpm | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" repo/$arch/charly-$arch.rpm
          done

      - name: Install-test
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws:ro" fedora:43 bash -c '
            set -e
            cat > /etc/yum.repos.d/charly.repo <<EOF
[charly]
name=charly
baseurl=file:///ws/repo/amd64
enabled=1
gpgcheck=1
gpgkey=file:///ws/RPM-GPG-KEY-charly
EOF
            dnf install -y charly
            test "$(charly version)" = "$VERSION" || { echo "version mismatch: $(charly version) != $VERSION"; exit 1; }
            cd /tmp && charly doctor
          '

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy
        uses: actions/deploy-pages@v4
